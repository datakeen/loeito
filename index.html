<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loeito — PDF, just right</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%233a8bff'/%3E%3Cstop offset='1' stop-color='%23005fd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpath d='M21 14h15l9 9v27H21z' fill='%23fff'/%3E%3Cpath d='M36 14v9h9' fill='%23cfe2ff'/%3E%3Cpath d='M27 31v11h10' stroke='%23005fd6' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500&family=Homemade+Apple&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/loeito.css">
</head>
<body>
<div id="app">
  <header class="toolbar" id="toolbar">
    <div class="tb-left">
      <button class="icon-btn" id="btn-sidebar" title="Show / hide pages (⌘\)"></button>
      <button class="doc-title" id="doc-title" title="Name &amp; details">
        <span class="brand-mark" id="brand-mark"></span>
        <span class="doc-name" id="doc-name">Loeito</span>
        <span class="doc-sub" id="doc-sub"></span>
      </button>
    </div>
    <nav class="blades" id="blades" aria-label="Tools"></nav>
    <div class="tb-right">
      <button class="icon-btn" id="btn-undo" title="Undo (⌘Z)"></button>
      <button class="icon-btn" id="btn-redo" title="Redo (⇧⌘Z)"></button>
      <div class="tb-sep"></div>
      <button class="icon-btn" id="btn-search" title="Find (Ctrl F)"></button>
      <button class="icon-btn" id="btn-help" title="Help — manuals, shortcuts, what’s new" aria-label="Help"></button>
      <div class="split-btn">
        <button class="btn primary" id="btn-save" title="Save (Ctrl S)"><span class="ic"></span><span>Save</span></button>
        <button class="btn primary more" id="btn-save-more" title="Save As, save a copy for sharing…" aria-label="More ways to save"></button>
      </div>
    </div>
  </header>
  <div class="tabbar" id="tabbar" role="tablist" hidden></div>

  <main class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="label" id="sidebar-count">Pages</span>
        <button class="icon-btn small" id="btn-add-files" title="Add PDFs or images"></button>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </aside>

    <section class="stage-wrap" id="stage-wrap">
      <div class="stage" id="stage">
        <div class="sheet" id="sheet">
          <canvas id="page-canvas"></canvas>
          <svg id="overlay" class="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="html-layer" class="html-layer"></div>
        </div>
        <div class="grid-view" id="grid-view" hidden></div>
      </div>
      <div class="reader" id="reader" tabindex="0" hidden><div class="reader-pages" id="reader-pages"></div></div>
      <div class="focus-bar"><div id="focus-progress"></div></div>
      <div class="focus-hud" id="focus-hud">
        <span id="focus-info"></span>
        <span class="focus-themes" id="focus-themes"><button data-t="paper" title="Paper">Aa</button><button data-t="sepia" title="Sepia">Aa</button><button data-t="night" title="Night">Aa</button></span>
        <button class="icon-btn small" id="focus-exit" title="Leave focus mode (Esc)"></button>
      </div>
      <div class="stage-hud" id="stage-hud">
        <button class="icon-btn small" id="btn-prev" title="Previous page"></button>
        <span class="page-indicator"><input id="page-input" inputmode="numeric" aria-label="Page"> <span id="page-total">/ 0</span></span>
        <button class="icon-btn small" id="btn-next" title="Next page"></button>
        <div class="hud-sep"></div>
        <button class="icon-btn small" id="btn-zoom-out" title="Zoom out (⌘−)"></button>
        <button class="zoom-label" id="zoom-label" title="Fit width / fit page">Fit</button>
        <button class="icon-btn small" id="btn-zoom-in" title="Zoom in (⌘+)"></button>
        <div class="hud-sep"></div>
        <div class="hud-tools" id="hud-tools" role="radiogroup" aria-label="Pointer">
          <button class="icon-btn small" data-tool="select" role="radio" title="Select (V) — use the tool, select text under the I-beam, drag empty paper to move"></button>
          <button class="icon-btn small" data-tool="text" role="radio" title="Text (T) — select text anywhere, even inside tools"></button>
          <button class="icon-btn small" data-tool="hand" role="radio" title="Hand (H) — drag to move the page · or hold Space"></button>
        </div>
      </div>
      <canvas id="loupe" class="loupe" width="168" height="168" hidden></canvas>
    </section>

    <aside class="inspector" id="inspector"></aside>

    <div class="welcome" id="welcome">
      <div class="welcome-inner">
        <div class="hero-mark" id="hero-mark"></div>
        <h1>Loeito</h1>
        <p class="tagline">Every PDF task. Just enough — nothing more.</p>
        <div class="dropzone" id="dropzone" tabindex="0" role="button">
          <div class="dz-icon" id="dz-icon"></div>
          <div class="dz-title">Drop a PDF here</div>
          <div class="dz-sub">or <span class="link">choose a file</span> · PDF, Word, Excel, images · stays on your computer</div>
        </div>
        <div class="recent" id="recent" hidden></div>
        <div class="blade-grid" id="blade-grid"></div>
        <p class="fineprint">Private by design: your files are processed entirely in this window and never uploaded. · Free and open-source software (GNU AGPL v3).</p>
      </div>
    </div>
  </main>

  <div class="search-pop" id="search-pop" hidden>
    <div class="search-field"><span class="ic" id="search-ic"></span><input id="search-input" placeholder="Find in document" autocomplete="off"><span id="search-count" class="muted"></span></div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<input type="file" id="file-input" accept="application/pdf,.pdf,image/png,image/jpeg,.doc,.docx,.rtf,.odt,.xls,.xlsx,.ods,.ppt,.pptx" multiple hidden>
<div id="hud-root"></div>
<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/viewer.js"></script>
<script src="js/docs.js"></script>
<script src="js/reader.js"></script>
<script src="js/build.js"></script>
<script src="js/geo.js"></script>
<script src="js/tablegrid.js"></script>
<script src="js/forms.js"></script>
<script src="js/formdetect.js"></script>
<script src="js/formtemplates.js"></script>
<script src="js/blades/view.js"></script>
<script src="js/blades/pages.js"></script>
<script src="js/blades/edit.js"></script>
<script src="js/blades/crop.js"></script>
<script src="js/blades/ocr.js"></script>
<script src="js/blades/tables.js"></script>
<script src="js/blades/digitize.js"></script>
<script src="js/blades/compress.js"></script>
<script src="js/blades/stamp.js"></script>
<script src="js/blades/covers.js"></script>
<script src="js/blades/forms.js"></script>
<script src="js/blades/protect.js"></script>
<script src="js/name.js"></script>
<script src="js/files.js"></script>
<script src="js/help.js"></script>
<script src="js/merge.js"></script>
<script src="js/palette.js"></script>
<script src="js/app.js"></script>
</body>
</html>
