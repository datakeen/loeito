# Publishes the website (https://datakeen.github.io/loeito/) and the browser version of Loeito (/try/) on every push to main.
name: Publish website
run-name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Website at the root, the browser version of Loeito in /try/
        run: |
          mkdir -p site/try
          cp -r website/. site/
          cp -r index.html css js docs samples LICENSE NOTICE.md site/try/
          rm -rf site/try/samples/source
          touch site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
