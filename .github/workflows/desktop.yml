# Loeito - free and open-source PDF workbench. SPDX-License-Identifier: AGPL-3.0-or-later
# Builds the installers on GitHub: Windows (setup .exe + portable .zip), macOS (.dmg), Linux (AppImage + .deb).
# Runs on every push of a version tag (e.g. v1.6.0) and creates a GitHub Release with the files;
# can also be started by hand from the Actions tab ("Run workflow") — then the files are under the run's Artifacts.
name: Desktop installers
run-name: Build installers · ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: macOS disk image helper
        if: runner.os == 'macOS'
        run: npm install --no-save --no-audit --no-fund dmg-license
      - name: Build installers
        shell: bash
        run: npm run dist -- --publish never 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds (signing certificates can be added later)
      - name: Show why the build stopped
        if: failure()
        shell: bash
        run: echo "::error title=Build log (last lines)::$(tail -c 2500 build.log | tr '\n' '|')"
      - uses: actions/upload-artifact@v4
        with:
          name: loeito-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*-portable-*.zip
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: warn

  release:
    # publishes whatever was built, so one platform can’t hold back the others
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
